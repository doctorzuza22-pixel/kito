name: Build Kito APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Copy web files into APK assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cp style.css app/src/main/assets/style.css
          cp app.js app/src/main/assets/app.js
          ls -l app/src/main/assets/

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kito-apk
          path: app/build/outputs/apk/debug/app-debug.apk