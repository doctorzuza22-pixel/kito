name: Build KITO Android APK (branded v1.1)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out KITO
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Prepare offline app assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cp style.css app/src/main/assets/style.css
          cp app.js app/src/main/assets/app.js
          node --check app/src/main/assets/app.js

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload KITO APK
        uses: actions/upload-artifact@v4
        with:
          name: KITO-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
